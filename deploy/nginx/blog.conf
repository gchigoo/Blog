# Production configuration for blog.cokedaily.space
# Install this file as /etc/nginx/sites-available/blog.conf and enable it.
# Install cloudflare-real-ip.conf as /etc/nginx/snippets/cloudflare-real-ip.conf
# and blog-maintenance.conf as /etc/nginx/snippets/blog-maintenance.conf first.
#
# Static cache contract: assets are cached only by the explicit path prefixes
# below (/css/, /js/, /vendor/, /fonts/, /images/, /audio/) and the exact
# /favicon.ico route. There is deliberately no extension-wide cache regex, so
# dot-containing taxonomy HTML routes such as /zh/tag/Node.js always flow
# through the dynamic proxy and are never treated as static resources.
#
# Public maintenance gate: during the coordinated cutover window (see DEPLOY.md
# "双语发布协调维护窗口"), enable the gate by uncommenting the include line inside
# the HTTPS server block below. Public traffic then receives 503 while loopback
# and the documented operator allowlist still reach the candidate application
# for smoke tests. Always run `sudo nginx -t` before every reload.

upstream blog_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Successful images keep the 30-day immutable contract. Any upstream error is
# explicitly private/no-store with no Expires header, so a missing .webp can
# never become Cloudflare/browser negative cache content.
map $upstream_status $blog_image_expires {
    ~^(200|206|304)$ 30d;
    default off;
}

map $upstream_status $blog_image_cache_control {
    ~^(200|206|304)$ "public, immutable";
    default "private, no-store";
}

# Published audio files are content-addressed under /audio/<locale>/<slug>/<hash>.ext.
# Successful responses may be cached for a year; errors stay private/no-store.
map $upstream_status $blog_audio_expires {
    ~^(200|206|304)$ 1y;
    default off;
}

map $upstream_status $blog_audio_cache_control {
    ~^(200|206|304)$ "public, max-age=31536000, immutable";
    default "private, no-store";
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.cokedaily.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.cokedaily.space;

    ssl_certificate /etc/nginx/ssl/origin-space.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-space.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Trust only Cloudflare to supply the real visitor address.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Public maintenance gate (see DEPLOY.md "双语发布协调维护窗口"). This line
    # ships inert/commented; during the cutover window the operator uncomments
    # it so the 443 listener returns 503 to public traffic while loopback and
    # the documented operator allowlist still reach the candidate application
    # for smoke tests. Run `sudo nginx -t` before every reload.
    # include /etc/nginx/snippets/blog-maintenance.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss application/rss+xml image/svg+xml application/manifest+json;

    # Keep the public analytics context endpoint on its strict 16 KiB boundary.
    location = /api/analytics/client-context {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache off;
        client_max_body_size 16k;
    }

    # Dynamic proxy catch-all. Every taxonomy HTML route that is not one of the
    # explicit static prefixes below — including /zh/tag/Node.js — is served
    # here and stays fully dynamic. No WebSockets; empty Connection preserves
    # upstream keepalive.
    location / {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately overwrite, rather than append, untrusted client XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Allow the documented 100 MiB file plus multipart framing overhead.
        client_max_body_size 101m;
    }

    # Explicit static path prefixes (never an extension-wide cache regex).
    # /css/ and /js/ are fingerprinted via ?v=<hash> (server/utils/presentation.js
    # assetUrl). Long-lived immutable caching is safe only when every reference
    # uses assetUrl(); un-fingerprinted URLs would stay stale for a year.
    location /css/ {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /js/ {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /vendor/ {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /fonts/ {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /images/ {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires $blog_image_expires;
        add_header Cache-Control $blog_image_cache_control always;
    }

    location /audio/ {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires $blog_audio_expires;
        add_header Cache-Control $blog_audio_cache_control always;
    }

    location = /favicon.ico {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    access_log /var/log/nginx/blog-access.log;
    error_log /var/log/nginx/blog-error.log;
}
