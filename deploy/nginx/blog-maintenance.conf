# Public maintenance gate for the blog application.
# Enabled ONLY during the coordinated cutover window by including this snippet
# from the blog server block (see DEPLOY.md "双语发布协调维护窗口"):
#
#   include /etc/nginx/snippets/blog-maintenance.conf;
#
# While enabled, public traffic receives 503; loopback and the documented
# operator allowlist below (by client address) still reach the candidate
# application for smoke tests. Always run `sudo nginx -t` before every reload,
# and remove the include once every smoke/audit check has passed.
set $blog_maintenance_reject 1;
if ($remote_addr = "127.0.0.1") { set $blog_maintenance_reject 0; }
if ($remote_addr = "::1") { set $blog_maintenance_reject 0; }
if ($remote_addr = "23.254.158.109") { set $blog_maintenance_reject 0; }
if ($blog_maintenance_reject = 1) { return 503; }
