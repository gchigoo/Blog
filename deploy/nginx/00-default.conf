# Catch-all for requests that name no site served here: bare-IP scans and unknown Host/SNI.
# Every real site matches by server_name first, so this only answers what nothing else claims.
# REALITY uses 127.0.0.1:18443, which keeps its own default in reality-cover-fangmo.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Same protocol range as every site on this socket; the default server shapes the first handshake.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
}
